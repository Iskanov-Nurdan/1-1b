<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
</head>
<body>
    <h1>Список пользователей</h1>

    {% for person in names %}
        <div>
            <h3>{{ person.name }}</h3>
            <p>Возраст: {{ person.age }}</p>
        </div>
    {% empty %}
        <p>Пользователей пока нет.</p>
    {% endfor %}
</body>
</html>
